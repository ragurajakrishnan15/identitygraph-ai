[project]
name = "identitygraph"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "backend/app/tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
